# Integration tests for commit-headless action
name: Test

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.24'

    - name: Run Go tests
      run: go test -v ./...

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    env:
      TEST_BRANCH: test/ci-${{ github.run_id }}

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
      with:
        go-version: '1.24'

    - name: Build action
      run: |
        mkdir -p ./action-template/dist
        go build -buildvcs=false -o ./action-template/dist/commit-headless-linux-amd64 .

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    # Create the test branch. All suites reset to github.sha before running.
    - name: Create test branch
      run: git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }}

    # ---- create-branch ----

    - name: "Test create-branch: create local commits"
      run: |
        git reset --hard ${{ github.sha }}

        echo "New branch content" > new-branch-file.txt
        git add new-branch-file.txt
        git commit -m "test: create-branch commit"

    - name: "Test create-branch: push to new branch"
      id: test-create-branch
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}-create
        head-sha: ${{ github.sha }}
        create-branch: true
        command: push

    - name: "Test create-branch: verify output"
      run: |
        if [ -z "${{ steps.test-create-branch.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.test-create-branch.outputs.pushed_ref }}"

    - name: "Test create-branch: verify commit on remote"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}-create

        log=$(git log origin/${{ env.TEST_BRANCH }}-create --oneline -2)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: create-branch commit"; then
          echo "ERROR: commit not found on new branch"
          exit 1
        fi

    - name: "Test create-branch: cleanup"
      if: always()
      run: git push origin --delete ${{ env.TEST_BRANCH }}-create || true

    # ---- push ----

    - name: "Test push: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test push: create local commits"
      run: |
        echo "First change" > test-file.txt
        git add test-file.txt
        git commit -m "test: first commit"

        echo "Second change" >> test-file.txt
        git add test-file.txt
        git commit -m "test: second commit"

    - name: "Test push: push commits"
      id: test-push
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: "Test push: verify output"
      run: |
        if [ -z "${{ steps.test-push.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.test-push.outputs.pushed_ref }}"

    - name: "Test push: verify commits on remote"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -3)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: first commit"; then
          echo "ERROR: first commit not found on remote"
          exit 1
        fi
        if ! echo "$log" | grep -q "test: second commit"; then
          echo "ERROR: second commit not found on remote"
          exit 1
        fi

    # ---- push (no changes) ----

    - name: "Test push no-op: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test push no-op: sync local with remote"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        git reset --hard origin/${{ env.TEST_BRANCH }}

    - name: "Test push no-op: no changes succeeds"
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    # ---- force ----

    - name: "Test force: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test force: create initial commits"
      run: |
        echo "Initial change" > test-file.txt
        git add test-file.txt
        git commit -m "test: initial commit"

    - name: "Test force: push initial commits"
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: "Test force: record pre-force HEAD"
      id: pre-force
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        echo "head_sha=$(git rev-parse origin/${{ env.TEST_BRANCH }})" >> $GITHUB_OUTPUT

    - name: "Test force: simulate rebase"
      run: |
        git reset --hard ${{ github.sha }}

        echo "Rebased change 1" > test-file.txt
        git add test-file.txt
        git commit -m "test: rebased commit 1"

        echo "Rebased change 2" >> test-file.txt
        git add test-file.txt
        git commit -m "test: rebased commit 2"

    - name: "Test force: force-push rebased commits"
      id: test-force
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        head-sha: ${{ github.sha }}
        force: true
        command: push

    - name: "Test force: verify output"
      run: |
        if [ -z "${{ steps.test-force.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.test-force.outputs.pushed_ref }}"

    - name: "Test force: verify rebased commits on remote"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        new_head=$(git rev-parse origin/${{ env.TEST_BRANCH }})
        old_head="${{ steps.pre-force.outputs.head_sha }}"

        echo "Old HEAD: $old_head"
        echo "New HEAD: $new_head"

        if [ "$new_head" = "$old_head" ]; then
          echo "ERROR: HEAD unchanged after force push"
          exit 1
        fi

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -3)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: rebased commit 1"; then
          echo "ERROR: rebased commit 1 not found on remote"
          exit 1
        fi
        if ! echo "$log" | grep -q "test: rebased commit 2"; then
          echo "ERROR: rebased commit 2 not found on remote"
          exit 1
        fi

        if echo "$log" | grep -q "test: initial commit"; then
          echo "ERROR: old pre-rebase commit still present"
          exit 1
        fi

    # ---- commit create-branch ----

    - name: "Test commit create-branch: stage changes"
      run: |
        git reset --hard ${{ github.sha }}

        echo "New branch via commit" > commit-branch-file.txt
        git add commit-branch-file.txt

    - name: "Test commit create-branch: commit to new branch"
      id: test-commit-create-branch
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}-commit-create
        head-sha: ${{ github.sha }}
        create-branch: true
        message: "test: commit create-branch"
        command: commit

    - name: "Test commit create-branch: verify output"
      run: |
        if [ -z "${{ steps.test-commit-create-branch.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.test-commit-create-branch.outputs.pushed_ref }}"

    - name: "Test commit create-branch: verify commit on remote"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}-commit-create

        log=$(git log origin/${{ env.TEST_BRANCH }}-commit-create --oneline -2)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: commit create-branch"; then
          echo "ERROR: commit not found on new branch"
          exit 1
        fi

    - name: "Test commit create-branch: cleanup"
      if: always()
      run: git push origin --delete ${{ env.TEST_BRANCH }}-commit-create || true

    # ---- commit ----

    - name: "Test commit: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test commit: stage changes"
      run: |
        echo "Committed via commit command" > commit-test.txt
        git add commit-test.txt

    - name: "Test commit: push staged changes"
      id: test-commit
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        message: "test: commit command"
        command: commit

    - name: "Test commit: verify output"
      run: |
        if [ -z "${{ steps.test-commit.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.test-commit.outputs.pushed_ref }}"

    - name: "Test commit: verify on remote"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -1)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: commit command"; then
          echo "ERROR: commit not found on remote"
          exit 1
        fi

    - name: "Test commit: no staged changes succeeds"
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        message: "this should not appear"
        command: commit

    # ---- file modes ----

    - name: "Test modes: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test modes: create executable"
      run: |
        echo '#!/bin/bash' > script.sh
        echo 'echo "Hello from script"' >> script.sh
        chmod +x script.sh
        git add script.sh
        git commit -m "test: add executable script"

    - name: "Test modes: push executable"
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: "Test modes: verify executable bit preserved"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        mode=$(git ls-tree origin/${{ env.TEST_BRANCH }} -- script.sh | awk '{print $1}')
        echo "File mode on remote: $mode"

        if [ "$mode" != "100755" ]; then
          echo "ERROR: executable bit not preserved, expected 100755 got $mode"
          exit 1
        fi
        echo "Executable bit preserved successfully"

    # ---- replay (multiple commits) ----

    - name: "Test replay: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test replay: create commits with regular git push"
      run: |
        echo "replay test 1" > replay-test.txt
        git add replay-test.txt
        git commit -m "test: replay commit 1"

        echo "replay test 2" >> replay-test.txt
        git add replay-test.txt
        git commit -m "test: replay commit 2"

        git push origin HEAD:${{ env.TEST_BRANCH }}

    - name: "Test replay: record pre-replay HEAD"
      id: pre-replay
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        echo "head_sha=$(git rev-parse origin/${{ env.TEST_BRANCH }})" >> $GITHUB_OUTPUT

    - name: "Test replay: replay commits as signed"
      id: test-replay
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        since: ${{ github.sha }}
        command: replay

    - name: "Test replay: verify output"
      run: |
        if [ -z "${{ steps.test-replay.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.test-replay.outputs.pushed_ref }}"

    - name: "Test replay: verify commits were replayed"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        new_head=$(git rev-parse origin/${{ env.TEST_BRANCH }})
        old_head="${{ steps.pre-replay.outputs.head_sha }}"

        echo "Old HEAD: $old_head"
        echo "New HEAD: $new_head"

        if [ "$new_head" = "$old_head" ]; then
          echo "ERROR: HEAD unchanged after replay"
          exit 1
        fi

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -3)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: replay commit 1"; then
          echo "ERROR: replay commit 1 not found"
          exit 1
        fi
        if ! echo "$log" | grep -q "test: replay commit 2"; then
          echo "ERROR: replay commit 2 not found"
          exit 1
        fi

        echo "Replay test passed: commits were replayed with new hashes"

    # ---- replay (single commit) ----

    - name: "Test replay single: reset"
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }} --force
        git reset --hard ${{ github.sha }}

    - name: "Test replay single: create one commit with regular git push"
      run: |
        echo "single replay test" > single-replay.txt
        git add single-replay.txt
        git commit -m "test: single unsigned commit"
        git push origin HEAD:${{ env.TEST_BRANCH }}

    - name: "Test replay single: record pre-replay HEAD"
      id: pre-replay-single
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        echo "head_sha=$(git rev-parse origin/${{ env.TEST_BRANCH }})" >> $GITHUB_OUTPUT

    - name: "Test replay single: replay single commit as signed"
      id: test-replay-single
      uses: ./action-template
      with:
        branch: ${{ env.TEST_BRANCH }}
        since: ${{ github.sha }}
        command: replay

    - name: "Test replay single: verify"
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        new_head=$(git rev-parse origin/${{ env.TEST_BRANCH }})
        old_head="${{ steps.pre-replay-single.outputs.head_sha }}"

        if [ "$new_head" = "$old_head" ]; then
          echo "ERROR: HEAD unchanged after replay"
          exit 1
        fi

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -1)
        echo "Remote log: $log"

        if ! echo "$log" | grep -q "test: single unsigned commit"; then
          echo "ERROR: single commit not found"
          exit 1
        fi

        echo "Single commit replay test passed"

    # Cleanup: delete test branch
    - name: Cleanup test branch
      if: always()
      run: |
        git push origin --delete ${{ env.TEST_BRANCH }} || true
