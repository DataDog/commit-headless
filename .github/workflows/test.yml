# Integration tests for commit-headless action
name: Test

permissions:
  contents: write

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26'

    - name: Run Go tests
      run: go test -v ./...

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version: '1.26'

    - name: Build binary
      run: |
        mkdir -p ./action-template/dist
        go build -buildvcs=false -o ./action-template/dist/commit-headless-linux-amd64 .

    - name: Upload action
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: action
        path: action-template/

  test-create-branch:
    runs-on: ubuntu-latest
    needs: build
    env: &env
      TEST_BRANCH: test/ci-${{ github.run_id }}-${{ github.job }}
    steps:
    - &checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0

    - &download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: action
        path: action/

    - &configure-git
      name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Create local commits
      run: |
        echo "New branch content" > new-branch-file.txt
        git add new-branch-file.txt
        git commit -m "test: create-branch commit"

    - name: Push to new branch
      id: push
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        head-sha: ${{ github.sha }}
        create-branch: true
        command: push

    - name: Verify output
      run: |
        if [ -z "${{ steps.push.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.push.outputs.pushed_ref }}"

    - name: Verify commit on remote
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -2)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: create-branch commit"; then
          echo "ERROR: commit not found on new branch"
          exit 1
        fi

    - &verify-no-tmp-branches
      name: Verify no leftover working branches
      run: |
        tmp_branches=$(git ls-remote --heads origin | grep -- '${{ env.TEST_BRANCH }}--headless-tmp-' || true)
        if [ -n "$tmp_branches" ]; then
          echo "ERROR: leftover working branches found:"
          echo "$tmp_branches"
          exit 1
        fi
        echo "No leftover working branches"

    - &cleanup
      name: Cleanup
      if: always()
      run: git push origin --delete ${{ env.TEST_BRANCH }} || true

  test-push:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git

    - &create-branch
      name: Create test branch
      run: git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }}

    - name: Create local commits
      run: |
        echo "First change" > test-file.txt
        git add test-file.txt
        git commit -m "test: first commit"

        echo "Second change" >> test-file.txt
        git add test-file.txt
        git commit -m "test: second commit"

    - name: Push commits
      id: push
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: Verify output
      run: |
        if [ -z "${{ steps.push.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.push.outputs.pushed_ref }}"

    - name: Verify commits on remote
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -3)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: first commit"; then
          echo "ERROR: first commit not found on remote"
          exit 1
        fi
        if ! echo "$log" | grep -q "test: second commit"; then
          echo "ERROR: second commit not found on remote"
          exit 1
        fi

    - *verify-no-tmp-branches

    - *cleanup

  test-push-no-op:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Sync local with remote
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        git reset --hard origin/${{ env.TEST_BRANCH }}

    - name: No changes succeeds
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - *verify-no-tmp-branches
    - *cleanup

  test-force:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git

    - name: Create test branch and push initial commit
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }}

        echo "Initial change" > test-file.txt
        git add test-file.txt
        git commit -m "test: initial commit"

    - name: Push initial commit
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: Record pre-force HEAD
      id: pre-force
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        echo "head_sha=$(git rev-parse origin/${{ env.TEST_BRANCH }})" >> $GITHUB_OUTPUT

    - name: Simulate rebase
      run: |
        git reset --hard ${{ github.sha }}

        echo "Rebased change 1" > test-file.txt
        git add test-file.txt
        git commit -m "test: rebased commit 1"

        echo "Rebased change 2" >> test-file.txt
        git add test-file.txt
        git commit -m "test: rebased commit 2"

    - name: Force-push rebased commits
      id: force-push
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        head-sha: ${{ github.sha }}
        force: true
        command: push

    - name: Verify output
      run: |
        if [ -z "${{ steps.force-push.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.force-push.outputs.pushed_ref }}"

    - name: Verify rebased commits on remote
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        new_head=$(git rev-parse origin/${{ env.TEST_BRANCH }})
        old_head="${{ steps.pre-force.outputs.head_sha }}"

        echo "Old HEAD: $old_head"
        echo "New HEAD: $new_head"

        if [ "$new_head" = "$old_head" ]; then
          echo "ERROR: HEAD unchanged after force push"
          exit 1
        fi

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -3)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: rebased commit 1"; then
          echo "ERROR: rebased commit 1 not found on remote"
          exit 1
        fi
        if ! echo "$log" | grep -q "test: rebased commit 2"; then
          echo "ERROR: rebased commit 2 not found on remote"
          exit 1
        fi

        if echo "$log" | grep -q "test: initial commit"; then
          echo "ERROR: old pre-rebase commit still present"
          exit 1
        fi

    - *verify-no-tmp-branches
    - *cleanup

  test-commit-create-branch:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git

    - name: Stage changes
      run: |
        echo "New branch via commit" > commit-branch-file.txt
        git add commit-branch-file.txt

    - name: Commit to new branch
      id: commit
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        head-sha: ${{ github.sha }}
        create-branch: true
        message: "test: commit create-branch"
        command: commit

    - name: Verify output
      run: |
        if [ -z "${{ steps.commit.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.commit.outputs.pushed_ref }}"

    - name: Verify commit on remote
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -2)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: commit create-branch"; then
          echo "ERROR: commit not found on new branch"
          exit 1
        fi

    - *verify-no-tmp-branches
    - *cleanup

  test-commit:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Stage changes
      run: |
        echo "Committed via commit command" > commit-test.txt
        git add commit-test.txt

    - name: Push staged changes
      id: commit
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        message: "test: commit command"
        command: commit

    - name: Verify output
      run: |
        if [ -z "${{ steps.commit.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.commit.outputs.pushed_ref }}"

    - name: Verify on remote
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -1)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: commit command"; then
          echo "ERROR: commit not found on remote"
          exit 1
        fi

    - name: No staged changes succeeds
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        message: "this should not appear"
        command: commit

    - *verify-no-tmp-branches
    - *cleanup

  test-modes:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Create executable
      run: |
        echo '#!/bin/bash' > script.sh
        echo 'echo "Hello from script"' >> script.sh
        chmod +x script.sh
        git add script.sh
        git commit -m "test: add executable script"

    - name: Push executable
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: Verify executable bit preserved
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        mode=$(git ls-tree origin/${{ env.TEST_BRANCH }} -- script.sh | awk '{print $1}')
        echo "File mode on remote: $mode"

        if [ "$mode" != "100755" ]; then
          echo "ERROR: executable bit not preserved, expected 100755 got $mode"
          exit 1
        fi
        echo "Executable bit preserved successfully"

    - *verify-no-tmp-branches
    - *cleanup

  test-binary-content:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Stage binary from dist
      run: |
        cp action/dist/commit-headless-linux-amd64 ./test-binary
        chmod +x test-binary
        sha256sum test-binary > expected-checksum.txt
        echo "Local binary checksum:"
        cat expected-checksum.txt

        git add test-binary expected-checksum.txt
        git commit -m "test: add binary executable"

    - name: Push binary
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push

    - name: Verify binary content is not corrupted
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        git checkout origin/${{ env.TEST_BRANCH }} -- test-binary expected-checksum.txt

        echo "Remote binary checksum:"
        sha256sum test-binary

        if ! sha256sum -c expected-checksum.txt; then
          echo "ERROR: binary content was corrupted during push"
          exit 1
        fi
        echo "Binary content integrity verified"

    - *verify-no-tmp-branches
    - *cleanup

  test-replay:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git

    - name: Create test branch and push unsigned commits
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }}

        echo "replay test 1" > replay-test.txt
        git add replay-test.txt
        git commit -m "test: replay commit 1"

        echo "replay test 2" >> replay-test.txt
        git add replay-test.txt
        git commit -m "test: replay commit 2"

        git push origin HEAD:${{ env.TEST_BRANCH }}

    - name: Record pre-replay HEAD
      id: pre-replay
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        echo "head_sha=$(git rev-parse origin/${{ env.TEST_BRANCH }})" >> $GITHUB_OUTPUT

    - name: Replay commits as signed
      id: replay
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        since: ${{ github.sha }}
        command: replay

    - name: Verify output
      run: |
        if [ -z "${{ steps.replay.outputs.pushed_ref }}" ]; then
          echo "ERROR: pushed_ref output is empty"
          exit 1
        fi
        echo "Pushed ref: ${{ steps.replay.outputs.pushed_ref }}"

    - name: Verify commits were replayed
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        new_head=$(git rev-parse origin/${{ env.TEST_BRANCH }})
        old_head="${{ steps.pre-replay.outputs.head_sha }}"

        echo "Old HEAD: $old_head"
        echo "New HEAD: $new_head"

        if [ "$new_head" = "$old_head" ]; then
          echo "ERROR: HEAD unchanged after replay"
          exit 1
        fi

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -3)
        echo "Remote log:"
        echo "$log"

        if ! echo "$log" | grep -q "test: replay commit 1"; then
          echo "ERROR: replay commit 1 not found"
          exit 1
        fi
        if ! echo "$log" | grep -q "test: replay commit 2"; then
          echo "ERROR: replay commit 2 not found"
          exit 1
        fi

        echo "Replay test passed: commits were replayed with new hashes"

    - *verify-no-tmp-branches
    - *cleanup

  test-reset:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Switch to local branch matching TEST_BRANCH and commit
      run: |
        git switch -c ${{ env.TEST_BRANCH }}

        echo "reset test" > reset-file.txt
        git add reset-file.txt
        git commit -m "test: reset commit"

    - name: Capture pre-push local HEAD
      id: pre-push
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Push with reset
      id: push
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push
        reset: true

    - name: Verify local HEAD now matches remote (re-signed) commit
      run: |
        pushed="${{ steps.push.outputs.pushed_ref }}"
        local_after=$(git rev-parse HEAD)
        pre_push="${{ steps.pre-push.outputs.sha }}"

        echo "Pre-push local:  $pre_push"
        echo "Pushed (remote): $pushed"
        echo "Post-push local: $local_after"

        if [ "$local_after" = "$pre_push" ]; then
          echo "ERROR: local HEAD unchanged; --reset did not run"
          exit 1
        fi
        if [ "$local_after" != "$pushed" ]; then
          echo "ERROR: local HEAD ($local_after) does not match pushed remote ($pushed)"
          exit 1
        fi

    - *verify-no-tmp-branches
    - *cleanup

  test-reset-dirty-skipped:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Switch to local branch and commit, then dirty the tree
      run: |
        git switch -c ${{ env.TEST_BRANCH }}

        echo "reset-dirty test" > reset-dirty.txt
        git add reset-dirty.txt
        git commit -m "test: reset-dirty commit"

        # Make a tracked-file modification that is NOT committed.
        echo "dirty modification" >> README.md

    - name: Capture pre-push local HEAD
      id: pre-push
      run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

    - name: Push with reset (no allow-dirty)
      id: push
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push
        reset: true

    - name: Verify reset was skipped and dirty change preserved
      run: |
        pushed="${{ steps.push.outputs.pushed_ref }}"
        local_after=$(git rev-parse HEAD)
        pre_push="${{ steps.pre-push.outputs.sha }}"

        echo "Pre-push local:  $pre_push"
        echo "Pushed (remote): $pushed"
        echo "Post-push local: $local_after"

        if [ "$local_after" != "$pre_push" ]; then
          echo "ERROR: local HEAD changed; --reset should have skipped on a dirty tree"
          exit 1
        fi
        if ! grep -q "dirty modification" README.md; then
          echo "ERROR: dirty modification was discarded; --reset should have skipped"
          exit 1
        fi

    - *verify-no-tmp-branches
    - *cleanup

  test-reset-allow-dirty:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git
    - *create-branch

    - name: Switch to local branch and commit, then dirty the tree
      run: |
        git switch -c ${{ env.TEST_BRANCH }}

        echo "reset-allow-dirty test" > reset-allow-dirty.txt
        git add reset-allow-dirty.txt
        git commit -m "test: reset-allow-dirty commit"

        # Tracked-file modification that should be discarded by --reset --allow-dirty.
        echo "dirty modification to be discarded" >> README.md

    - name: Push with reset and allow-dirty
      id: push
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        command: push
        reset: true
        allow-dirty: true

    - name: Verify local HEAD matches remote and dirty change was discarded
      run: |
        pushed="${{ steps.push.outputs.pushed_ref }}"
        local_after=$(git rev-parse HEAD)

        if [ "$local_after" != "$pushed" ]; then
          echo "ERROR: local HEAD ($local_after) does not match pushed remote ($pushed)"
          exit 1
        fi
        if grep -q "dirty modification to be discarded" README.md; then
          echo "ERROR: dirty modification still present; --allow-dirty should have discarded it"
          exit 1
        fi

    - *verify-no-tmp-branches
    - *cleanup

  test-replay-single:
    runs-on: ubuntu-latest
    needs: build
    env: *env
    steps:
    - *checkout
    - *download
    - *configure-git

    - name: Create test branch and push one unsigned commit
      run: |
        git push origin ${{ github.sha }}:refs/heads/${{ env.TEST_BRANCH }}

        echo "single replay test" > single-replay.txt
        git add single-replay.txt
        git commit -m "test: single unsigned commit"
        git push origin HEAD:${{ env.TEST_BRANCH }}

    - name: Record pre-replay HEAD
      id: pre-replay
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}
        echo "head_sha=$(git rev-parse origin/${{ env.TEST_BRANCH }})" >> $GITHUB_OUTPUT

    - name: Replay single commit as signed
      id: replay
      uses: ./action/
      with:
        branch: ${{ env.TEST_BRANCH }}
        since: ${{ github.sha }}
        command: replay

    - name: Verify
      run: |
        git fetch origin ${{ env.TEST_BRANCH }}

        new_head=$(git rev-parse origin/${{ env.TEST_BRANCH }})
        old_head="${{ steps.pre-replay.outputs.head_sha }}"

        if [ "$new_head" = "$old_head" ]; then
          echo "ERROR: HEAD unchanged after replay"
          exit 1
        fi

        log=$(git log origin/${{ env.TEST_BRANCH }} --oneline -1)
        echo "Remote log: $log"

        if ! echo "$log" | grep -q "test: single unsigned commit"; then
          echo "ERROR: single commit not found"
          exit 1
        fi

        echo "Single commit replay test passed"

    - *verify-no-tmp-branches
    - *cleanup
